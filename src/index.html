<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>タップカウンター</title>
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="カウンター">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <button id="tap" class="tap" type="button" aria-label="タップして1増やす">
      <span id="count" class="count" aria-live="polite">0</span>
      <span class="hint">タップで +1</span>
    </button>
    <div class="actions">
      <button id="minus" class="btn" type="button" aria-label="1減らす">−1</button>
      <button id="reset" class="btn danger" type="button">リセット</button>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
